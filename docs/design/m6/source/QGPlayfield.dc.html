<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiet player with playfield sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
a{color:#8AB4FF}a:hover{color:#B7D0FF}
.rst{position:relative;flex-shrink:0;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:#8F9AB6;opacity:.3;display:inline-grid;place-items:center;cursor:pointer;transition:opacity .15s,background .15s}
.rst[data-changed="true"]{opacity:.95;color:var(--acc)}
.rst:hover,.rst:focus-visible{opacity:1;background:rgba(255,255,255,.08)}
.rst:hover::after,.rst:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);right:-4px;white-space:nowrap;padding:4px 8px;border-radius:6px;background:#0B1020;border:1px solid rgba(255,255,255,.14);color:#E8ECF6;font-size:12px;pointer-events:none;z-index:20}
.secrst{display:inline-flex;align-items:center;gap:6px;padding:4px 6px;border:0;border-radius:6px;background:transparent;color:#8F9AB6;font-size:12px;cursor:pointer}
.secrst:hover{color:#E8ECF6;background:rgba(255,255,255,.06)}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 720px; overflow: hidden; background: #05070F; font-family: 'Inter Tight', system-ui, sans-serif; color: #E8ECF6; --acc: {{accent}}">
  <div style="position: absolute; top: 0; bottom: 0; left: 0; right: 360px">
    <div style="position: absolute; inset: 0"><dc-import name="Scene" hint-size="100%,720px"></dc-import></div>

    <section aria-label="Song" style="position: absolute; top: 24px; left: 28px; display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 10px rgba(0,0,0,0.9)">
      <div style="font-size: 17px; font-weight: 500">Minuet in G</div>
      <div style="font-size: 13px; color: #A7B0C6">Christian Petzold · B section</div>
      <div style="font-size: 44px; font-weight: 300; letter-spacing: -0.02em; margin-top: 10px; line-height: 1">18<span style="color: #7F89A3">:2</span></div>
      <div style="font-size: 13px; color: #A7B0C6">bar of 64 · 0:52 / 1:31</div>
    </section>
    <section aria-label="Tempo" style="position: absolute; top: 24px; right: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-shadow: 0 1px 10px rgba(0,0,0,0.9)">
      <div style="font-size: 44px; font-weight: 300; letter-spacing: -0.02em; line-height: 1">107</div>
      <div style="font-size: 13px; color: #A7B0C6">bpm · 85% of 126</div>
    </section>

    <div role="toolbar" aria-label="Playback" style="position: absolute; left: 50%; bottom: 204px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 999px; background: rgba(5,7,15,0.35)">
      <button aria-label="Songs and bookmarks" style="width: 44px; height: 44px; border: 0; background: transparent; color: rgba(232,236,246,0.75); display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
      <button aria-label="Previous bar" style="width: 44px; height: 44px; border: 0; background: transparent; color: rgba(232,236,246,0.85); display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M18 6l-9 6 9 6z"></path></svg></button>
      <button aria-label="Play" style="width: 48px; height: 48px; border: 1.5px solid rgba(232,236,246,0.9); border-radius: 999px; background: transparent; color: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 6l10 6-10 6z"></path></svg></button>
      <button aria-label="Next bar" style="width: 44px; height: 44px; border: 0; background: transparent; color: rgba(232,236,246,0.85); display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6z"></path></svg></button>
      <button aria-label="Loop bars 17 to 32: on" aria-pressed="true" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"></path></svg></button>
      <button aria-label="Playfield settings: open" aria-pressed="true" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: rgba(138,180,255,0.18); color: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
    </div>

    <div aria-label="Song position, loop bars 17 to 32" style="position: absolute; left: 28px; right: 28px; bottom: 172px; height: 24px">
      <div style="position: absolute; left: 0; right: 0; top: 11px; height: 2px; border-radius: 2px; background: rgba(232,236,246,0.16)"></div>
      <div style="position: absolute; left: 0; width: 27%; top: 11px; height: 2px; border-radius: 2px; background: rgba(232,236,246,0.75)"></div>
      <div style="position: absolute; left: 25%; width: 25%; top: 5px; height: 14px; border-radius: 4px; background: rgba(232,236,246,0.12); border: 1px solid rgba(232,236,246,0.35)"></div>
      <div style="position: absolute; left: 27%; top: 4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 999px; background: #FFFFFF"></div>
    </div>
  </div>

  <aside aria-label="Playfield settings" style="position: absolute; top: 0; right: 0; bottom: 0; width: 360px; box-sizing: border-box; background: rgba(14,18,32,0.72); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-left: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: auto">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 4px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 500">Playfield</h2>
      <button aria-label="Close playfield settings" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.06); color: #C9D2E8; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <p style="margin: 0; padding: 0 20px 14px; font-size: 13px; color: #A7B0C6">Changes show live on the highway.</p>

    <button aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #C9D2E8; font-size: 15px; text-align: left; cursor: pointer">Camera<span style="display: flex; align-items: center; gap: 10px"><span aria-label="has changes" style="width: 6px; height: 6px; border-radius: 999px; background: {{accent}}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></button>
    <button aria-expanded="true" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer">Keyboard<span style="display: flex; align-items: center; gap: 10px"><span aria-label="has changes" style="width: 6px; height: 6px; border-radius: 999px; background: {{accent}}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button>
    <div style="padding: 2px 20px 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9D2E8"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Key thickness</span><span style="color: #FFFFFF">0.60</span><button class="rst" data-tip="Reset to default" aria-label="Reset key thickness to default" data-changed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></span><input aria-label="Key thickness" type="range" min="0.1" max="1.5" step="0.05" value="0.6" style="accent-color: {{accent}}"></div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9D2E8"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Gap between keys</span><span style="color: #FFFFFF">0.06</span><button class="rst" data-tip="Reset to default" aria-label="Reset gap between keys to default" data-changed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></span><input aria-label="Gap between keys" type="range" min="0" max="0.2" step="0.01" value="0.06" style="accent-color: {{accent}}"></div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9D2E8"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Black key height</span><span style="color: #FFFFFF">12 mm</span><button class="rst" data-tip="Reset to default" aria-label="Reset black key height to default" data-changed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></span><input aria-label="Black key height" type="range" min="0.1" max="0.6" step="0.01" value="0.51" style="accent-color: {{accent}}"></div>
      <div style="display: flex; align-items: center; gap: 8px">
      <div role="group" aria-label="Edge profile" style="flex: 1; display: flex; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.06)">
        <button style="flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: transparent; color: #C9D2E8; font-size: 13px; cursor: pointer">None</button>
        <button aria-pressed="true" style="flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: rgba(138,180,255,0.22); color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">Chamfer</button>
        <button style="flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: transparent; color: #C9D2E8; font-size: 13px; cursor: pointer">Rounded</button>
      </div>
      <button class="rst" data-tip="Reset to default" aria-label="Reset edge profile to default" data-changed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9D2E8"><label for="pf-animate" style="flex: 1">Animate keys</label><input id="pf-animate" type="checkbox" checked style="width: 18px; height: 18px; margin: 0 3px; accent-color: {{accent}}"><button class="rst" data-tip="Reset to default" aria-label="Reset animate keys to default" data-changed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9D2E8"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">White key depth</span><span style="color: #FFFFFF">5 mm</span><button class="rst" data-tip="Reset to default" aria-label="Reset white key depth to default" data-changed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></span><input aria-label="White key depth" type="range" min="0.05" max="0.6" step="0.01" value="0.22" style="accent-color: {{accent}}"></div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9D2E8"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Black key depth</span><span style="color: #FFFFFF">7 mm</span><button class="rst" data-tip="Reset to default" aria-label="Reset black key depth to default" data-changed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></span><input aria-label="Black key depth" type="range" min="0.05" max="0.43" step="0.01" value="0.3" style="accent-color: {{accent}}"></div>
      <button class="secrst" style="align-self: flex-end"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>Reset keyboard to grand piano</button>
    </div>
    <button aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #C9D2E8; font-size: 15px; text-align: left; cursor: pointer">Highway<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <button aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #C9D2E8; font-size: 15px; text-align: left; cursor: pointer">Notes<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <button aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #C9D2E8; font-size: 15px; text-align: left; cursor: pointer">Effects<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <button aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06); background: transparent; color: #C9D2E8; font-size: 15px; text-align: left; cursor: pointer">Render quality<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <div style="margin-top: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 10px">
      <button class="secrst" style="align-self: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>Reset all playfield settings</button>
      <button style="width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #E8ECF6; font-size: 14px; cursor: pointer">All settings…</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8AB4FF","options":["#8AB4FF","#7EE0C3","#E8ECF6"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8AB4FF' };
  }
}
</script>
</body>
</html>
