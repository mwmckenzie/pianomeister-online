<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmark management</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
input{font:inherit}
a{color:#8AB4FF}a:hover{color:#B7D0FF}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 720px; overflow: hidden; background: #05070F; font-family: 'Inter Tight', system-ui, sans-serif; color: #E8ECF6">
  <div style="position: absolute; inset: 0"><dc-import name="Scene" hint-size="100%,720px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(5,7,15,0.72)"></div>

  <div style="position: absolute; inset: 16px; display: flex; flex-direction: column; border-radius: 22px; background: rgba(18,24,44,0.55); backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%); border: 1px solid rgba(255,255,255,0.10); overflow: hidden">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08)">
      <button style="height: 40px; padding: 0 14px 0 10px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.06); color: #E8ECF6; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Player</button>
      <nav aria-label="Manage" style="display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.06)">
        <a href="QGLibrary.dc.html" style="padding: 8px 16px; border-radius: 9px; color: #C9D2E8; font-size: 14px; text-decoration: none">Library</a>
        <a href="QGBookmarks.dc.html" aria-current="page" style="padding: 8px 16px; border-radius: 9px; background: rgba(138,180,255,0.22); color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">Bookmarks</a>
      </nav>
      <label style="flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,0.06); color: #A7B0C6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search bookmarks</span><input type="search" placeholder="Search bookmarks or songs" style="flex: 1; border: 0; background: transparent; color: #FFFFFF; font-size: 14px; outline: none"></label>
    </header>

    <div style="flex: 1; min-height: 0; display: flex">
      <aside aria-label="Songs" style="width: 190px; flex-shrink: 0; padding: 16px 14px; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 4px; overflow: auto">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8F9AB6; padding-bottom: 4px">Show</div>
        <button aria-pressed="true" style="text-align: left; padding: 7px 10px; border: 0; border-radius: 9px; background: rgba(138,180,255,0.16); color: #FFFFFF; font-size: 14px; cursor: pointer">All bookmarks <span style="color: #A7B0C6">7</span></button>
        <button style="text-align: left; padding: 7px 10px; border: 0; border-radius: 9px; background: transparent; color: #C9D2E8; font-size: 14px; cursor: pointer">Minuet in G <span style="color: #8F9AB6">2</span></button>
        <button style="text-align: left; padding: 7px 10px; border: 0; border-radius: 9px; background: transparent; color: #C9D2E8; font-size: 14px; cursor: pointer">Canon in D <span style="color: #8F9AB6">3</span></button>
        <button style="text-align: left; padding: 7px 10px; border: 0; border-radius: 9px; background: transparent; color: #C9D2E8; font-size: 14px; cursor: pointer">Invention No. 1 <span style="color: #8F9AB6">2</span></button>
      </aside>

      <div style="flex: 1; min-width: 0; padding: 8px 0; display: flex; flex-direction: column; overflow: auto">
        <div style="padding: 10px 18px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8F9AB6">Minuet in G · 64 bars</div>
        <div title="The full song is tracked like a bookmark but can't be edited" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; color: #C9D2E8; font-size: 14px"><span style="display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 6px; font-weight: 500"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Not editable"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Full song</span><span style="font-size: 12px; color: #8F9AB6">Always available · not editable</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; inset: 0; border-radius: 3px; background: rgba(138,180,255,0.45)"></span></span><span>9 plays</span><span>21 min</span><span style="color: #A7B0C6">Yesterday</span></div>
        <button aria-pressed="true" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; border: 0; background: rgba(138,180,255,0.14); color: #FFFFFF; font-size: 14px; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 500">B section</span><span style="font-size: 12px; color: #A7B0C6">Bars 17–32 · 85% · pre-roll 2</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; top: 0; bottom: 0; left: 25%; width: 25%; border-radius: 3px; background: {{accent}}"></span></span><span>9 plays</span><span>14 min</span><span style="color: #A7B0C6">Today</span></button>
        <button style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; border: 0; background: transparent; color: #E8ECF6; font-size: 14px; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 500">Left hand only</span><span style="font-size: 12px; color: #A7B0C6">Bars 1–8 · 70% · right muted</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; top: 0; bottom: 0; left: 0%; width: 12.5%; border-radius: 3px; background: {{accent}}"></span></span><span>5 plays</span><span>6 min</span><span style="color: #A7B0C6">Yesterday</span></button>
        <div style="padding: 16px 18px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8F9AB6">Canon in D · 102 bars</div>
        <div title="The full song is tracked like a bookmark but can't be edited" style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; color: #C9D2E8; font-size: 14px"><span style="display: flex; flex-direction: column; gap: 3px"><span style="display: flex; align-items: center; gap: 6px; font-weight: 500"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Not editable"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Full song</span><span style="font-size: 12px; color: #8F9AB6">Always available · not editable</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; inset: 0; border-radius: 3px; background: rgba(138,180,255,0.45)"></span></span><span>2 plays</span><span>22 min</span><span style="color: #A7B0C6">5 days</span></div>
        <button style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; border: 0; background: transparent; color: #E8ECF6; font-size: 14px; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 500">Variations</span><span style="font-size: 12px; color: #A7B0C6">Bars 9–16 · 80% · pre-roll 2</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; top: 0; bottom: 0; left: 7.8%; width: 7.8%; border-radius: 3px; background: {{accent}}"></span></span><span>6 plays</span><span>12 min</span><span style="color: #A7B0C6">Yesterday</span></button>
        <button style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; border: 0; background: transparent; color: #E8ECF6; font-size: 14px; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 500">Arpeggio run</span><span style="font-size: 12px; color: #A7B0C6">Bars 45–52 · 60% · pre-roll 4</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; top: 0; bottom: 0; left: 43.1%; width: 7.8%; border-radius: 3px; background: {{accent}}"></span></span><span>4 plays</span><span>9 min</span><span style="color: #A7B0C6">4 days</span></button>
        <button style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 70px 70px 80px; align-items: center; gap: 12px; padding: 12px 18px; border: 0; background: transparent; color: #E8ECF6; font-size: 14px; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 500">Ending</span><span style="font-size: 12px; color: #A7B0C6">Bars 97–102 · 100%</span></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10)"><span style="position: absolute; top: 0; bottom: 0; left: 94.1%; width: 5.9%; border-radius: 3px; background: {{accent}}"></span></span><span>3 plays</span><span>4 min</span><span style="color: #A7B0C6">Last week</span></button>
      </div>

      <aside aria-label="Bookmark details" style="width: 360px; flex-shrink: 0; padding: 18px; border-left: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 14px; overflow: auto">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7B0C6">Name<input type="text" value="B section" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #FFFFFF; font-size: 15px"></label>
        <div style="font-size: 13px; color: #A7B0C6">Song: <span style="color: #DCE3F3">Minuet in G</span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7B0C6">From bar<input type="number" value="17" style="height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #FFFFFF; font-size: 15px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7B0C6">To bar<input type="number" value="32" style="height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #FFFFFF; font-size: 15px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7B0C6">Pre-roll<input type="number" value="2" style="height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #FFFFFF; font-size: 15px"></label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7B0C6"><span style="display: flex; justify-content: space-between">Tempo<span style="color: #FFFFFF">85%</span></span><input type="range" min="25" max="200" value="85" style="accent-color: {{accent}}"></label>
        <div role="group" aria-label="Hands" style="display: flex; padding: 3px; border-radius: 10px; background: rgba(255,255,255,0.06)">
          <button aria-pressed="true" style="flex: 1; padding: 7px 0; border: 0; border-radius: 8px; background: rgba(138,180,255,0.22); color: #FFFFFF; font-size: 13px; cursor: pointer">Both hands</button>
          <button style="flex: 1; padding: 7px 0; border: 0; border-radius: 8px; background: transparent; color: #C9D2E8; font-size: 13px; cursor: pointer">Right only</button>
          <button style="flex: 1; padding: 7px 0; border: 0; border-radius: 8px; background: transparent; color: #C9D2E8; font-size: 13px; cursor: pointer">Left only</button>
        </div>
        <div style="height: 1px; background: rgba(255,255,255,0.08)"></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <div><div style="font-size: 12px; color: #A7B0C6">Played</div><div style="font-size: 20px; font-weight: 300">9×</div></div>
          <div><div style="font-size: 12px; color: #A7B0C6">Practice</div><div style="font-size: 20px; font-weight: 300">14 min</div></div>
          <div><div style="font-size: 12px; color: #A7B0C6">Last</div><div style="font-size: 20px; font-weight: 300">Today</div></div>
        </div>
        <div aria-label="Practice minutes per day, last 14 days" style="display: flex; align-items: flex-end; gap: 4px; height: 44px">
          <span style="flex: 1; height: 0%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 20%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 0%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 45%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 30%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 0%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 0%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 60%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 25%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 0%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 40%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 15%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 80%; background: rgba(138,180,255,0.6); border-radius: 2px"></span><span style="flex: 1; height: 100%; background: {{accent}}; border-radius: 2px"></span>
        </div>
        <div style="margin-top: auto; display: flex; gap: 8px">
          <button style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: {{accent}}; color: #0B1020; font-size: 14px; font-weight: 600; cursor: pointer">Load in player</button>
          <button style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #E8ECF6; font-size: 14px; cursor: pointer">Duplicate</button>
          <button style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,140,140,0.35); background: transparent; color: #FFB4B4; font-size: 14px; cursor: pointer">Delete</button>
        </div>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8AB4FF","options":["#8AB4FF","#7EE0C3","#E8ECF6"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8AB4FF' };
  }
}
</script>
</body>
</html>
