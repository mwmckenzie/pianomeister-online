name: E2E

# The full functional e2e suite (chromium + polish projects) on the production build, for every
# pull request to main and every push to its branch. Sharded across four runners; one retry, so
# a test that passes on its retry is reported as flaky in the summary but doesn't fail the job.
# The visual, perf, range and sheet projects never run here (only when a milestone asks).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build-only
      - name: Test (shard ${{ matrix.shard }}/4)
        run: npx playwright test --project=chromium --project=polish --shard=${{ matrix.shard }}/4
      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  report:
    # The shards' results as one HTML report and a summary of failed and flaky tests.
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter=html ./all-blob-reports
          npx playwright merge-reports --reporter=json ./all-blob-reports > e2e-results.json
      - name: Summary (failed and flaky tests)
        run: node scripts/e2e-summary.mjs e2e-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
