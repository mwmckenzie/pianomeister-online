name: E2E

# The full functional e2e suite (chromium + polish projects) on the production build. Manual
# only for now (Actions → E2E → Run workflow): on GitHub's GPU-less runners the suite is too slow
# to gate pull requests yet (roadmap: "Make CI e2e workable"); the CI workflow's check job stays
# the required check. Sharded across four runners; one retry, so a test that passes on its retry
# is reported as flaky in the summary but doesn't fail the job. The visual, perf, range and sheet
# projects never run here (only when a milestone asks).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A bound, not a target: a healthy shard takes a few minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build
        run: npm run build-only
      - name: Test (shard ${{ matrix.shard }}/4)
        run: npx playwright test --project=chromium --project=polish --shard=${{ matrix.shard }}/4
      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  report:
    # The shards' results as one HTML report and a summary of failed and flaky tests.
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter=html ./all-blob-reports
          npx playwright merge-reports --reporter=json ./all-blob-reports > e2e-results.json
      - name: Summary (failed and flaky tests)
        run: node scripts/e2e-summary.mjs e2e-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
